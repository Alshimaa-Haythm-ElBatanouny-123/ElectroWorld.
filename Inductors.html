<!DOCTYPE html>
<html lang="en">
    <title>Inductors</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    :root {
        --bg-dark: #0b1120;
        --bg-gradient: radial-gradient(circle at top right, #1e293b, #0b1120 70%);
        --card-bg: rgba(30, 41, 59, 0.65);
        --card-border: rgba(148, 163, 184, 0.15);
        --accent-green: #a2d134;
        --accent-cyan: #38bdf8;
        --accent-gold: #fbbf24;
        --text-main: #f8fafc;
    }

    * {
        box-sizing: border-box;
    }

    /* الخلفية العامة */
    body {
        background: var(--bg-dark);
        background-image: var(--bg-gradient);
        font-family: 'Poppins', sans-serif;
        color: var(--text-main);
        text-align: center;
        margin: 0;
        padding: 0 0 50px 0;
        min-height: 100vh;
        line-height: 1.7;
    }

    /* تنسيق الصور العامة */
    img {
        border-radius: 14px;
        border: 1px solid var(--card-border);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        max-width: 100%;
    }

    img:hover {
        transform: scale(1.03);
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.2);
    }

    /* تنسيق الشريط العلوي والعنوان */
    #name {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--card-border);
        padding: 20px 5%;
        margin-bottom: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    h1 {
        color: var(--accent-green);
        font-size: 2.3rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2.5px;
        margin: 0;
        text-shadow: 0 0 15px rgba(162, 209, 52, 0.3);
    }

    /* صندوق المعلومات والشرح */
    #information {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
        border: 1px solid var(--card-border);
        padding: 30px;
        border-radius: 16px;
        width: 85%;
        max-width: 1100px;
        margin: 25px auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
    }

    #information mark {
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent-cyan);
        padding: 2px 10px;
        border-radius: 6px;
        font-weight: 600;
        border-bottom: 2px solid var(--accent-cyan);
    }

    /* تنسيق الجداول والبطاقات بداخلها */
    table {
        width: 90%;
        max-width: 1280px;
        margin: 35px auto;
        border-collapse: separate;
        border-spacing: 20px;
        border: none;
    }

    td {
        padding: 10px;
        text-align: center;
        vertical-align: top;
        border: none;
    }

    td figure {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        padding: 18px;
        margin: 0;
        border-radius: 16px;
        transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
    }

    td figure:hover {
        transform: translateY(-8px);
        border-color: var(--accent-cyan);
        box-shadow: 0 15px 30px rgba(56, 189, 248, 0.15);
    }

    /* صور العناصر داخل الجداول */
    td img {
        border-radius: 12px;
        background: #ffffff;
        object-fit: cover;
        transition: transform 0.4s ease;
        box-shadow: none;
    }

    td figure:hover img {
        transform: scale(1.06);
    }

    /* تصميم الروابط */
    a {
        display: inline-block;
        margin-top: 12px;
        text-decoration: none;
        color: var(--accent-gold);
        font-weight: 600;
        font-size: 1.05rem;
        letter-spacing: 0.5px;
        transition: color 0.3s ease, transform 0.3s ease;
    }

    a:hover {
        color: var(--accent-cyan);
    }

    /* التجاوب مع شاشات الموبايل */
    @media (max-width: 768px) {
        h1 {
            font-size: 1.6rem;
        }
        #information {
            width: 92%;
            padding: 20px;
        }
        table, tbody, tr, td {
            display: block;
            width: 100%;
        }
        td {
            margin-bottom: 15px;
        }
    }
</style>
<body>
    <h1><ins><i>Inductor</i></ins></h1><br>
    <section>
        <img src="https://www.electricalcity.net/wp-content/uploads/2018/06/inductors-shapes.jpg" width="800px" height="400px"><br>
        <table border="4">
            <tr>
                <td><figure>
                    <a href="A Transformer.html" title=" Go To A Transformer"> <img src=" https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsONlO-DRchv6XoPiXwRk4cw454eCLphKOzsZkdYwdo0GprU6CKAk_uIwENhwlj2EaTxo&usqp=CAU"width="150px" height="150px"><br><b> Transformer </b></a>
                </figure></td>
                <td><figure>
                    <a href=" A Variable Inductorr.html" title=" Go To A Variable Inductorr"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS17BajKqX7pHB9KY9T6n3HDivW9ZOMLMJbAXQ4TiC4cpU2xOvy1uY3FoC9a8Q0T8RX8Cg&usqp=CAU " width="150px" height="150px"><br><b>Variable Inductorr</b></a>
                </figure></td>
                <td><figure>
                    <a href=" An Inductor.html" title=" Go To An Inductor">  <img src=" https://media.rs-online.com/image/upload/bo_1.5px_solid_white,b_auto,c_pad,dpr_2,f_auto,h_399,q_auto,w_710/c_pad,h_399,w_710/R1048432-01?pgw=1" width="150px" height="150px"><br><b>Inductor</b></a>
                </figure></td>
            </tr>
        </table>
    </section>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    // تلوين الخلفية عند المرور على الصور
    const figures = document.querySelectorAll("td figure");
    figures.forEach(figure => {
        figure.addEventListener("mouseenter", () => {
            figure.style.backgroundColor = "rgba(255, 255, 255, 0.25)";
        });
        figure.addEventListener("mouseleave", () => {
            figure.style.backgroundColor = "rgba(255, 255, 255, 0.15)";
        });
    });

});
</script>
</html>
